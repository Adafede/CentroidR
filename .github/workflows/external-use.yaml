---
name: External Use
on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch: null
permissions: read-all
jobs:
  CentroidR-test:
    name: CentroidR-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
          - ubuntu-26.04-arm
          # - macos-26-intel
          # - windows-11-vs2026-arm
    defaults:
      run:
        shell: bash
    steps:
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          use-public-rspm: true

      - name: Install dependencies (Linux)
        if: contains(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            libarchive-dev libcurl4-openssl-dev libfribidi-dev libharfbuzz-dev libnetcdf-dev libuv1-dev \
          && sudo apt-get clean \
          && sudo rm -rf /var/lib/apt/lists/*

      - name: Install dependencies (macOS)
        if: contains(matrix.os, 'macos')
        run: |
          brew update
          brew install netcdf
          NETCDF_PREFIX="$(brew --prefix netcdf)"

      - name: Install dependencies (Windows)
        if: contains(matrix.os, 'windows')
        run: true

      - name: Install
        run: |
          cran <- getOption("repos")["CRAN"]
          cran <- if (is.na(cran) || !nzchar(cran) || cran == "@CRAN@") {
            "https://cloud.r-project.org"
          } else {
            unique(c(unname(cran), "https://cloud.r-project.org"))
          }
          ncpus <- max(1L, parallel::detectCores(logical = FALSE), na.rm = TRUE)
          Sys.setenv(MAKEFLAGS = paste0("-j", ncpus))
          install.packages(
            "CentroidR",
            repos = c(
              "https://adafede.r-universe.dev",
              "https://bioc-release.r-universe.dev",
              cran
            ),
            Ncpus = ncpus
          )
          stopifnot(
            requireNamespace("CentroidR", quietly = TRUE),
            requireNamespace("Spectra", quietly = TRUE)
          )
        shell: Rscript {0}

      - name: Run pipeline
        run: |
          td <- tempfile("smoke_")
          dir.create(td)
          on.exit(unlink(td, recursive = TRUE), add = TRUE)
          in_mzml <- file.path(td, "profile_test.mzML")
          out_mzml <- file.path(td, "centroided_test.mzML")
          sp <- Spectra::Spectra(data.frame(
            msLevel = 1L,
            polarity = 1L,
            rtime = 1.5,
            mz = I(list(c(100.000, 100.001, 100.002, 100.003, 100.004))),
            intensity = I(list(c(10, 50, 100, 50, 10)))
          ))
          Spectra::export(sp, backend = Spectra::MsBackendMzR(), file = in_mzml)
          ok <- CentroidR::centroid_one_file(
            file = in_mzml,
            pattern = "profile_",
            replacement = "centroided_"
          )
          stopifnot(isTRUE(ok), file.exists(out_mzml))
          res <- Spectra::Spectra(out_mzml, backend = Spectra::MsBackendMzR())
          stopifnot(length(res) == 1L, nrow(Spectra::peaksData(res)[[1L]]) == 1L)
        shell: Rscript {0}
